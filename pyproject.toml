[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phrike"
version = "0.1.0"
description = "Experimental pseudo-spectral research code for compressible hydrodynamics and ideal MHD"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Eric R. Moseley"}
]
keywords = ["computational fluid dynamics", "magnetohydrodynamics", "spectral methods"]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.10",
  "matplotlib>=3.5",
  "PyYAML>=6.0",
  "numba>=0.58",
  "mpmath>=1.3.0"
]

[project.scripts]
phrike = "phrike.cli:main"

[project.urls]
Repository = "https://github.com/ermoseley/phrike"
Issues = "https://github.com/ermoseley/phrike/issues"

[project.optional-dependencies]
fastfft = ["pyfftw>=0.13"]
torch = ["torch>=2.0.0"]
high-precision = ["mpmath>=1.3.0", "sympy>=1.14.0"]
dev = ["build>=1.2", "pytest>=7.0", "ruff>=0.3.0"]
docs = ["sphinx>=5.0", "sphinx-rtd-theme>=1.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
phrike = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["phrike*"]
exclude = ["tests", "examples", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
