name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q
      - run: python -m sphinx -W -b html docs docs/_build/html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build --outdir dist
      - name: Check distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              unexpected = [
                  name for name in archive.namelist()
                  if not (name.startswith("phrike/") or ".dist-info/" in name)
              ]
          assert not unexpected, unexpected

          sdist = next(Path("dist").glob("*.tar.gz"))
          with open_tar(sdist) as archive:
              names = archive.getnames()
          excluded = (
              "/build/", "/dist/", "/docs/_build/", "/runs/", "/pet-runs/",
              "/outputs/", "/dedalus_dir/", "/dgpy/", "/quail/",
              "/ramses-utils/", "/LagrangianPhaseSpaceSheetEasy/",
          )
          unexpected = [name for name in names if any(item in name for item in excluded)]
          assert not unexpected, unexpected
          PY
