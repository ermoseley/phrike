# Legendre-Lobatto Sod shock tube. Fixed endpoints pin the initial
# primitive state; they are not reflecting walls. N=64 is a runnable
# default. Raise N for a finer shock profile.
problem: sod

grid:
  N: 64
  Lx: 1.0
  x0: 0.5
  basis: legendre
  bc: dirichlet
  dealias: false
  precision: double

physics:
  gamma: 1.4

integration:
  t0: 0.0
  t_end: 0.2
  cfl: 0.2
  scheme: rk4
  output_interval: 0.05
  checkpoint_interval: 0.0
  modal_filter:
    enabled: true
    p: 8
    alpha: 36.0

initial_conditions:
  left:
    rho: 1.0
    u: 0.0
    p: 1.0
  right:
    rho: 0.125
    u: 0.0
    p: 0.1
  smoothing:
    enabled: false

artificial_viscosity:
  enabled: true
  mode: constant
  nu_constant: 0.001

io:
  outdir: outputs/sod_legendre

monitoring:
  enabled: true
  step_interval: 20

video:
  fps: 20
  codec: libx264
  crf: 23
  pix_fmt: yuv420p
