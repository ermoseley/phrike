# Hydrostatic equilibrium on a Legendre grid.
# +gx accelerates toward +x. With gx = -1 and rho = 1 on [0, 2],
# dp/dx = -1, so p(0) = 2.5 gives p(L) = 0.5. Pressure is integrated
# from the left state on the actual nodes; the right pressure is not
# an independent input. Fixed endpoints hold the initial primitives.
problem: hse_1d

grid:
  N: 64
  Lx: 2.0
  basis: legendre
  bc: dirichlet
  dealias: false
  precision: double

physics:
  gamma: 1.4

integration:
  t0: 0.0
  t_end: 0.1
  cfl: 0.3
  scheme: rk4
  output_interval: 0.05
  checkpoint_interval: 0.0
  modal_filter:
    enabled: true
    p: 8
    alpha: 36.0

gravity:
  enabled: true
  type: linear
  gx: -1.0
  gy: 0.0
  gz: 0.0

initial_conditions:
  left:
    rho: 1.0
    u: 0.0
    p: 2.5
  right:
    rho: 1.0
  smoothing:
    sigma: 0.01

artificial_viscosity:
  enabled: false

io:
  outdir: outputs/hse_1d_test

monitoring:
  enabled: true
  step_interval: 20

video:
  fps: 15
  codec: libx264
  crf: 23
  pix_fmt: yuv420p
