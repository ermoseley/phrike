# Taylor-Green vortex with the Brachet et al. (1983) pressure field.
# Ma = U0 / sqrt(gamma * p0 / rho0) = 0.1. The mean pressure is
# p0 = rho0 * U0^2 / (gamma * Ma^2) = 100/gamma for these parameters.
# 3D artificial viscosity is not implemented. Do not add an
# artificial_viscosity block: a present mapping is passed to the solver.
problem: tgv3d

grid:
  Nx: 32
  Ny: 32
  Nz: 32
  Lx: 6.283185307179586
  Ly: 6.283185307179586
  Lz: 6.283185307179586
  dealias: true
  precision: double

physics:
  gamma: 1.4

integration:
  t0: 0.0
  t_end: 1.0
  cfl: 0.2
  scheme: rk4
  output_interval: 0.1
  checkpoint_interval: 0.0
  spectral_dissipation:
    enabled: false

adaptive:
  enabled: true
  scheme: rk45
  rtol: 1.0e-5
  atol: 1.0e-7
  safety_factor: 0.9
  min_dt_factor: 0.1
  max_dt_factor: 5.0
  max_rejections: 10
  fallback_scheme: rk4

initial_conditions:
  rho0: 1.0
  U0: 1.0
  mach: 0.1
  k: 1

io:
  outdir: outputs/tgv3d

video:
  fps: 20
  codec: libx264
  crf: 23
  pix_fmt: yuv420p

monitoring:
  enabled: true
  step_interval: 25
  include_conservation: true
  include_timestep: true
  include_velocity_stats: true
