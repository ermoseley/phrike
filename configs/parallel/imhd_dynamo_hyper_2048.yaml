# 2048^3 periodic fluctuation dynamo for a node with eight GPUs.
# Run with one MPI rank per GPU, from the repository root:
#   srun -N 1 -n 8 python -m phrike.parallel imhd_turb --backend cuda --config configs/parallel/imhd_dynamo_hyper_2048.yaml
#
# The 288^3 reference and this higher-resolution comparison use identical
# physical coefficients, forcing and initial conditions. The forcing amplitude
# was calibrated at 288^3. Check the saturated energies at this resolution.
# Transform one field at a time with overlapping NCCL exchanges.
problem: imhd_turb

grid:
  Nx: 2048
  Ny: 2048
  Nz: 2048
  Lx: 6.283185307179586
  Ly: 6.283185307179586
  Lz: 6.283185307179586
  precision: single

physics:
  viscosity: 0.0
  resistivity: 0.0
  hyperviscosity: 3.666e-11    # 1 / 2.728e10
  hyperresistivity: 3.666e-11
  hyper_order: 6               # nu_h k^6
  spherical_truncation: false

integration:
  t0: 0.0
  t_end: 60.0
  cfl: 0.6
  scheme: rk4
  output_interval: 2.0
  checkpoint_interval: 10.0

forcing:
  type: ou
  kmin: 2.0
  kmax: 4.0
  profile: power_law
  spectral_index: -1.6666666666666667
  amplitude: 1.36
  correlation_time: 1.0
  seed: 1

initial_conditions:
  vrms: 1.0
  kmin: 2.0
  kmax: 4.0
  spectrum_type: parabolic
  seed: 42
  b_rms: 1.0e-3
  b_kmin: 2.0
  b_kmax: 8.0
  b_seed: 123
  b0: [0.0, 0.0, 0.0]

io:
  outdir: outputs/imhd_dynamo_hyper_2048
  snapshots: true
  slices: true
  spectra: true
  keep_checkpoints: 2
  format: auto                 # hdf5 if h5py imports, else npy
  fields:                      # physical-space output for analysis and ParaView
    enabled: true
    every: 1                   # every output (integration.output_interval)
    precision: single
    coarsen: 512               # spectral low-pass onto 512^3: 0.54 GB per component
    variables: default         # u and b
  diagnostics:
    enabled: true
    every: 1
    transfer: {enabled: true, every: 5}

monitoring:
  enabled: true
  step_interval: 50

parallel:
  transpose: auto              # nccl on several GPUs, alltoallv otherwise
  fft_batch: 1
