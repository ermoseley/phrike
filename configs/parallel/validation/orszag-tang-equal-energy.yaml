# Run A using the equal initial energies printed in the paper.
# beta = sqrt(2/3) gives E_b(0) = E_u(0) = 2. The printed beta=0.8 gives E_b(0)=1.92.
problem: imhd_orszag_tang

grid: {Nx: 256, Ny: 256, Nz: 256, precision: double}
physics: {viscosity: 0.005, resistivity: 0.005}
initial_conditions: {beta: 0.816496580927726}
integration: {t_end: 4.4, cfl: 0.3, scheme: rk4, output_interval: 0.04}

io:
  outdir: runs/orszag-tang-equal-energy
  format: hdf5
  snapshots: false
  slices: false
  spectra: false
  diagnostics: {enabled: false}

monitoring: {enabled: false}
parallel: {transpose: auto, fft_batch: 1, overlap: true}
