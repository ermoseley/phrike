# Statistical comparison with Cho et al. (2009), 256H3-B0=1e-3.
# This uses Jack's sixth-order coefficients and PHRIKE's OU forcing amplitude and spectrum.
problem: imhd_turb

grid: {Nx: 256, Ny: 256, Nz: 256, precision: single}
physics: {viscosity: 0.0, resistivity: 0.0, hyperviscosity: 3.666e-11, hyperresistivity: 3.666e-11, hyper_order: 6}
integration: {t_end: 150.0, cfl: 0.6, scheme: rk4, output_interval: 1.0, checkpoint_interval: 30.0}

forcing:
  type: ou
  kmin: 2.0
  kmax: 3.4641016151377544
  profile: power_law
  spectral_index: -1.6666666666666667
  amplitude: 1.36
  correlation_time: 1.0
  seed: 1

initial_conditions: {vrms: 1.0, kmin: 2.0, kmax: 3.4641016151377544, seed: 42, b_rms: 0.0, b0: [0.0, 0.0, 0.001]}

io:
  outdir: runs/cho-comparison
  format: hdf5
  snapshots: false
  slices: false
  spectra: true
  diagnostics: {enabled: true}
  keep_checkpoints: 2

monitoring: {enabled: true, step_interval: 200}
parallel: {fft_batch: 1, overlap: true}
