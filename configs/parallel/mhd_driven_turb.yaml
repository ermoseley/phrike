# Driven compressible visco-resistive MHD turbulence on the distributed fast path.
#   srun -n 8 python -m phrike.parallel mhd_turb3d --config configs/parallel/mhd_driven_turb.yaml
#
# Newtonian shear viscosity (kinematic nu) and Ohmic resistivity, with their
# viscous-work and Poynting energy fluxes (docs/equations.rst).  They bound the
# step by cfl_diff / (max(4/3 nu rho_max/rho_min, eta) k_max^2).  Subsonic and
# super-Alfvenic for these values (sonic Mach about 0.3, mean-field M_A = 3).
problem: mhd_turb3d

grid:
  Nx: 256
  Ny: 256
  Nz: 256
  Lx: 6.283185307179586
  Ly: 6.283185307179586
  Lz: 6.283185307179586
  precision: single

physics:
  gamma: 1.6666666666666667
  mhd:
    resistivity: 2.0e-3
    viscosity: 2.0e-3
    divergence_clean: projection

integration:
  t0: 0.0
  t_end: 20.0
  cfl: 0.3
  scheme: rk4
  output_interval: 0.5
  checkpoint_interval: 5.0
  spectral_dissipation:
    enabled: false

forcing:
  type: ou
  kmin: 1.0
  kmax: 2.5
  amplitude: 0.15
  correlation_time: 2.0
  compressive_fraction: 0.0
  seed: 1

initial_conditions:
  rho0: 1.0
  p0: 0.6            # sound speed 1
  vrms: 0.3
  kmin: 1.0
  kmax: 4.0
  alpha: 0.0         # compressive fraction of the initial velocity
  seed: 42
  b_rms: 0.01
  b_kmin: 1.0
  b_kmax: 4.0
  b0: [0.0, 0.0, 0.1]
  b_seed: 123

io:
  outdir: outputs/mhd_driven_turb
  # Optional analysis output (see docs/parallel.rst, "Output and restart"):
  # format: auto               # auto | hdf5 | npy
  # fields: {enabled: true, every: 1, precision: single, coarsen: 128, variables: default}
  # diagnostics: {enabled: true, every: 1, transfer: {enabled: false, every: 5}}

monitoring:
  enabled: true
  step_interval: 20

parallel:
  gpu_aware_mpi: false
  fft_batch: 4
