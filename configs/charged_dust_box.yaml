problem: charged_dust_box
grid:
  N: 16
  Lx: 1.0
  precision: double
  dealias: true
physics:
  gamma: 1.4
  mhd:
    resistivity: 0.0
    viscosity: 0.0
    project_each_substage: true
integration:
  t0: 0.0
  t_end: 0.05
  cfl: 0.3
  scheme: rk4
  output_interval: 0.01
  spectral_dissipation:
    enabled: false
dust:
  enabled: true
  closure: gaussian
  charge_to_mass: 10.0
  backreaction: true
  stopping:
    model: constant
    t_s: 0.1
sgs:
  enabled: true
  pressure: true
  production: filter_drain
  decay: true
  d_model: mt25_magnetized
initial_conditions:
  rho0: 1.0
  p0: 1.0
  velocity: [0.0, 0.0, 0.0]
  magnetic_field: [1.0, 0.5, 0.25]
  dust_velocity: [0.2, 0.1, -0.1]
  dust_to_gas: 0.01
  sigma0: 0.1
  e_s_fraction: 0.05
runtime:
  num_threads: 1
io:
  outdir: outputs/charged_dust_box
