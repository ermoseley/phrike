# Right-going acoustic eigenmode on a Legendre grid with Neumann ends.
# The periodic translate is not a reference once the wave hits a wall.
problem: acoustic1d

grid:
  N: 64
  Lx: 1.0
  basis: legendre
  bc: neumann
  precision: double

physics:
  gamma: 1.4

integration:
  t0: 0.0
  t_end: 0.5
  cfl: 0.3
  scheme: rk45
  output_interval: 0.05
  checkpoint_interval: 0.1
  modal_filter:
    enabled: true
    p: 8
    alpha: 50.0

initial_conditions:
  wave: acoustic
  direction: right
  rho0: 1.0
  u0: 0.0
  p0: 1.0
  amplitude: 0.01
  k: 1

# Adaptive time-stepping
adaptive:
  enabled: true
  scheme: rk45
  rtol: 1e-6
  atol: 1e-8
  safety_factor: 0.9
  min_dt_factor: 0.1
  max_dt_factor: 5.0
  max_rejections: 10
  fallback_scheme: rk4

io:
  outdir: outputs/acoustic_neumann
monitoring:
  enabled: true
  step_interval: 20
  include_conservation: true
  include_timestep: true
  include_time: true
  include_velocity_stats: true
  include_density_stats: true
