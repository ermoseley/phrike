# 1D Rayleigh-Taylor. Heavy fluid sits at large x.
# +gx accelerates toward +x, so gx = -1 makes that stack unstable
# and keeps the hydrostatic pressure positive.
problem: rti_1d

grid:
  N: 64
  Lx: 2.0
  basis: legendre
  bc: dirichlet
  dealias: false
  precision: double

physics:
  gamma: 1.4

integration:
  t0: 0.0
  t_end: 0.5
  cfl: 0.3
  scheme: rk4
  output_interval: 0.05
  checkpoint_interval: 0.2
  modal_filter:
    enabled: true
    p: 8
    alpha: 36.0

adaptive:
  enabled: true
  scheme: rk45
  rtol: 1.0e-5
  atol: 1.0e-7
  safety_factor: 0.9
  min_dt_factor: 0.1
  max_dt_factor: 5.0
  max_rejections: 10
  fallback_scheme: rk4

artificial_viscosity:
  enabled: true
  mode: constant
  nu_constant: 0.0005
  variable_weights:
    density: 1.0
    momentum_x: 1.0
    energy: 1.0

gravity:
  enabled: true
  type: linear
  gx: -1.0
  gy: 0.0
  gz: 0.0

initial_conditions:
  rho_heavy: 2.0
  rho_light: 1.0
  pressure_top: 2.5
  interface_thickness: 0.05
  perturb_amplitude: 0.01
  perturb_wavelength: 1.0

io:
  outdir: outputs/rti_1d_athena

monitoring:
  enabled: true
  step_interval: 50
  include_conservation: true
  include_timestep: true
  include_time: true

video:
  fps: 30
  width: 1280
  height: 720
  codec: libx264
  crf: 20
  preset: medium
  pix_fmt: yuv420p
