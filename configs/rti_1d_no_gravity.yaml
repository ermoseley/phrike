# 1D density jump with gravity off. Pressure stays at pressure_top.
problem: rti_1d

grid:
  N: 64
  Lx: 2.0
  basis: legendre
  bc: dirichlet
  dealias: false
  precision: double

physics:
  gamma: 1.4

integration:
  t0: 0.0
  t_end: 0.2
  cfl: 0.3
  scheme: rk4
  output_interval: 0.05
  checkpoint_interval: 0.0
  modal_filter:
    enabled: true
    p: 8
    alpha: 36.0

artificial_viscosity:
  enabled: true
  mode: constant
  nu_constant: 0.0005

gravity:
  enabled: false
  type: linear
  gx: 0.0
  gy: 0.0
  gz: 0.0

initial_conditions:
  rho_heavy: 2.0
  rho_light: 1.0
  pressure_top: 2.5
  interface_thickness: 0.05
  perturb_amplitude: 0.01
  perturb_wavelength: 1.0

io:
  outdir: outputs/rti_1d_no_gravity

monitoring:
  enabled: true
  step_interval: 20

video:
  fps: 20
  codec: libx264
  crf: 23
  pix_fmt: yuv420p
