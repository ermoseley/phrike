# 1D Hall-MRI eigenmode: axisymmetric shearing sheet, uniform vertical field B0 along x.
# Radial axis y, azimuthal axis z (phi = x cross y). The seed is the fastest-growing
# linear eigenvector; the run reports the measured growth rate against it.
#   python -m phrike hall_mri1d --config configs/hall_mri1d.yaml --backend cpu
problem: hall_mri1d

grid:
  N: 32
  Lx: auto               # 2*pi*mode/k_fastest of the linear problem; a number sets the box
  dealias: true
  precision: double      # the 1e-6 seed needs double precision

physics:
  gamma: 1.6666666666666667
  mhd:
    enabled: true
    resistivity: 0.0
    viscosity: 0.0
    divergence_clean: projection
    project_each_substage: true
    shearing_sheet:
      omega: 1.0
      q: 1.5               # shear S = q*omega; or give `shear:` directly (omega: 0 is pure shear)
      vertical_axis: 0
      radial_axis: 1
    hall:
      enabled: true
      eta_h: 0.5           # sign(eta_h * Omega.B0) selects the Hall-MRI branch
      eta_h_form: constant
      method: inertia      # reference | inertia
      length: 0.05         # inertia regularization length; the seed uses the same value

integration:
  t0: 0.0
  t_end: 12.0              # about e^8 growth from the seed: still linear
  cfl: 0.3
  scheme: rk4
  output_interval: 1.0
  checkpoint_interval: 0.0
  spectral_dissipation:
    enabled: false

initial_conditions:
  rho0: 1.0
  B0: 1.0
  beta: 400.0              # 2 p/B0^2: compressibility is negligible
  mode: 1                  # box mode of the seed
  amplitude: 1.0e-6        # |b|/|B0|

io:
  outdir: outputs/hall_mri1d

monitoring:
  enabled: true            # required: the mode amplitude is sampled at monitoring steps
  step_interval: 20
  include_conservation: false
  include_timestep: true
  include_time: true
