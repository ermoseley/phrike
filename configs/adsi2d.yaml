# 2.5D ADSI: periodic x, open y, out-of-plane shear U_z(y).
# python -m phrike adsi2d --config configs/adsi2d.yaml --backend numpy
# Ambipolar diffusion drives the growth. Set physics.mhd.ambipolar.enabled to
# false for an ideal-MHD control: it is expected NOT to grow, and the run reports
# the |By_k1| amplitude envelope (adsi_growth.json) instead of a growth rate.
problem: adsi2d

grid:
  Nx: 128
  Ny: 257
  Lx: 1.0
  Ly: 2.0
  dealias: true
  precision: single

physics:
  gamma: 1.6666666666666667
  mhd:
    resistivity: 0.0
    viscosity: 0.0
    divergence_clean: projection
    project_each_substage: false
    ambipolar:
      enabled: true
      eta: 1.0
      method: midpoint_resolvent
      midpoint_tol: 1.0e-5
      midpoint_maxiter: 200
      preconditioner: fourier_tensor

integration:
  t0: 0.0
  t_end: 5.0
  cfl: 0.35
  scheme: rk4
  output_interval: 0.25
  checkpoint_interval: 0.0
  spectral_dissipation:
    enabled: false
  sbp_dissipation:
    enabled: true
    strength: 0.01

initial_conditions:
  p0: 60.0
  width: 0.05
  velocity: 0.5
  field: 0.28209479177387814
  seed_amplitude: 0.0003    # max |delta B_y| relative to the background component
  reference_points: 257
  reference_alpha: 1.0     # ambipolar coefficient of the seed eigenmode; keep it at 1 for an ideal control

io:
  outdir: outputs/adsi2d

video:
  fps: 20
  frame_dpi: 130

monitoring:
  enabled: true
  step_interval: 100
  include_conservation: true
  include_timestep: true
  include_time: true
