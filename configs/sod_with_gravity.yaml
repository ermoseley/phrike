# Sod shock tube with a body force on a non-periodic Chebyshev grid.
# +gx accelerates toward +x, so gx < 0 accelerates toward x = 0.
# The setup is not the standard Sod problem: gravity breaks the usual
# self-similar wave pattern. There is still only one discontinuity.
problem: sod

grid:
  N: 128
  Lx: 1.0
  x0: 0.5
  basis: chebyshev
  bc: fixed
  dealias: true
  precision: double

physics:
  gamma: 1.4

gravity:
  enabled: true
  type: linear
  gx: -1.0
  gy: 0.0
  gz: 0.0

integration:
  t0: 0.0
  t_end: 0.1
  cfl: 0.2
  scheme: rk4
  output_interval: 0.02
  checkpoint_interval: 0.0
  modal_filter:
    enabled: false

initial_conditions:
  left:
    rho: 1.0
    u: 0.0
    p: 1.0
  right:
    rho: 0.125
    u: 0.0
    p: 0.1
  smoothing:
    enabled: false

artificial_viscosity:
  enabled: true
  mode: constant
  nu_constant: 0.001

io:
  outdir: outputs/sod_with_gravity

monitoring:
  enabled: true
  step_interval: 50

video:
  fps: 20
  codec: libx264
  crf: 23
  pix_fmt: yuv420p
