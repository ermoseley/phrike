problem: gaussian_wave2d
grid:
  Nx: 128
  Ny: 128
  Lx: 1.0
  Ly: 1.0
  basis_x: "fourier"
  basis_y: "fourier"
  # Both directions are Fourier, so the domain is periodic. Grid2D does
  # not accept bc: periodic; that name is only valid for a 1D Fourier grid.
  dealias: true
  precision: "double"

initial_conditions:
  rho0: 1.0
  u0: 0.0
  v0: 0.0
  p0: 1.0
  amplitude: 0.1
  sigma: 0.05
  x0: 0.5
  y0: 0.5
  angle: 0.0 # Zero velocity case

physics:
  gamma: 1.4
integration:
  t0: 0.0
  t_end: 1.0
  scheme: "rk4"
  cfl: 0.5
  spectral_dissipation:
    enabled: false

  output_interval: 0.1
artificial_viscosity:
  enabled: true
  nu_max: 1e-4
  s_ref: 1.0
  s_min: 0.1
  p: 2.0
  epsilon: 1e-12
  variable_weights:
    density: 1.0
    momentum_x: 1.0
    momentum_y: 1.0
    energy: 1.0
  sensor_variable: "density"
  diagnostic_output: false

io:
  outdir: "outputs/gaussian_center_fourier"
monitoring:
  step_interval: 10
