# 2D Orszag-Tang vortex (MHD) at 1024^2 on Metal (MPS):
#   python -m phrike orszag_tang2d --config configs/orszag_tang2d.yaml \
#       --backend torch --device mps --video
#
# The run is ideal MHD. Without dissipation the 2/3 Fourier truncation rings
# density and pressure below zero in the current sheets near t ~ 0.19. The
# solver floors them, the Alfven speed in the floored cells becomes huge, and
# the run stops with a "Time step collapsed" error. The
# integration.spectral_dissipation block below prevents this; it was verified
# at 64^2, 128^2 and 256^2 (double, t_end = 0.5). A few cells still reach the
# pressure floor, and the solver warns once per run when the floor is used.
problem: orszag_tang2d

grid:
  Nx: 1024
  Ny: 1024
  Lx: 1.0
  Ly: 1.0
  dealias: true
  precision: single        # MPS uses float32

physics:
  gamma: 1.6666666666666667   # 5/3
  mhd:
    resistivity: 0.0          # eta. Explicit, so it tightens the time step (dt <~ 1/(eta k_max^2)).
    viscosity: 0.0            # nu, explicit like eta
    divergence_clean: projection
    project_each_substage: true

integration:
  t0: 0.0
  t_end: 0.5
  cfl: 0.25
  scheme: rk4
  output_interval: 0.05
  checkpoint_interval: 0.0
  spectral_dissipation:
    enabled: true
    order: 8
    rate: 300.0               # damping rate of the cutoff mode, 1/time
    onset_fraction: 0.5       # modes below half the cutoff are untouched

initial_conditions: {}        # standard Stone/Athena OT normalization

io:
  outdir: outputs/orszag_tang2d

video:
  fps: 20
  frame_dpi: 130

monitoring:
  enabled: true
  step_interval: 50
  include_conservation: true
  include_timestep: true
  include_time: true
