# Shu-Osher shock-entropy interaction on a non-periodic Chebyshev grid.
# Post-shock (x < 0.5), the Mach-3 Rankine-Hugoniot state:
#   rho = 3.857143, u = 2.629369, p = 10.33333
# Pre-shock: rho = 1 + 0.2*sin(2*pi*x), u = 0, p = 1.
# A periodic grid would add a second jump at the seam. There is no
# closed-form solution after the shock enters the entropy wave.
# Constant viscosity is used; a saturated smoothness sensor collapses dt.
problem: shu_osher1d

grid:
  N: 192
  Lx: 1.0
  basis: chebyshev
  bc: fixed
  dealias: true
  precision: double

physics:
  gamma: 1.4

integration:
  t0: 0.0
  t_end: 0.05
  cfl: 0.2
  scheme: rk4
  output_interval: 0.01
  checkpoint_interval: 0.0
  modal_filter:
    enabled: false

initial_conditions:
  x_shock: 0.5

artificial_viscosity:
  enabled: true
  mode: constant
  nu_constant: 0.001

io:
  outdir: outputs/shu_osher1d

monitoring:
  enabled: true
  step_interval: 20

video:
  fps: 20
  codec: libx264
  crf: 23
  pix_fmt: yuv420p
